# Render Blueprint for SriLekh Staging Environment
# NOTE: Render Background Worker services require a paid/Starter+ instance type
# (not available on Render Free tier). Ensure only ONE scheduler (`beat`) instance runs.
services:
  - type: web
    name: vouch-staging-api
    runtime: python
    branch: fix/stage4-12-day6-remediation
    buildCommand: ./build.sh
    startCommand: MALLOC_ARENA_MAX=2 gunicorn config.wsgi:application --workers 1 --threads 4 --timeout 180 --max-requests 500 --max-requests-jitter 50
    healthCheckPath: /api/v1/health/environment/
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://vouch-pi-one.vercel.app,https://staging.srilekh.com

  - type: worker
    name: vouch-staging-worker
    runtime: python
    branch: fix/stage4-12-day6-remediation
    buildCommand: pip install -r requirements.txt
    startCommand: MALLOC_ARENA_MAX=2 celery -A config worker --loglevel=info --concurrency=2 --prefetch-multiplier=1 --max-tasks-per-child=100
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false

  - type: worker
    name: vouch-staging-beat
    runtime: python
    branch: fix/stage4-12-day6-remediation
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A config beat --loglevel=info --pidfile=/tmp/celerybeat.pid --schedule=/tmp/celerybeat-schedule
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false

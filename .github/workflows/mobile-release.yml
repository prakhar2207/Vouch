name: Build Mobile Apps (Google Play & Apple App Store)

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    name: Build Google Play Android App Bundle (.aab)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Setup Java 21 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Build Next.js Production & Offline Assets
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.srilekh.com

      - name: Sync Capacitor Android
        working-directory: frontend
        run: npx cap sync android

      - name: Build Android App Bundle (.aab) & Debug APK (.apk)
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          ./gradlew bundleRelease || ./gradlew bundle

      - name: Upload Google Play AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: google-play-app-bundle
          path: frontend/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: warn

      - name: Upload Debug APK Artifact (For Direct Phone Testing)
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: frontend/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

  build-ios:
    name: Build Apple App Store iOS Project
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Build Next.js Production & Offline Assets
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.srilekh.com

      - name: Sync Capacitor iOS
        working-directory: frontend
        run: npx cap sync ios

      - name: Upload iOS Xcode Project Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apple-appstore-ios-workspace
          path: frontend/ios

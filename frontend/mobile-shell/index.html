<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>SriLekh - Business Accounting & ERP</title>
  <meta name="theme-color" content="#0F172A" />
  <link rel="manifest" href="/manifest.json" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #0F172A;
      color: #F8FAFC;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      text-align: center;
      padding: 24px;
    }
    .logo-container {
      margin-bottom: 24px;
      animation: pulse 2s infinite ease-in-out;
    }
    .logo {
      width: 88px;
      height: 88px;
      border-radius: 20px;
      background: linear-gradient(135deg, #2563EB, #1E40AF);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      font-weight: 800;
      color: white;
      box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.4);
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.025em;
      margin-bottom: 8px;
    }
    p {
      color: #94A3B8;
      font-size: 14px;
      max-width: 320px;
      line-height: 1.5;
      margin-bottom: 32px;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top-color: #38BDF8;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    .status-text {
      font-size: 12px;
      color: #64748B;
      font-weight: 500;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <div class="logo">S</div>
  </div>
  <h1>SriLekh</h1>
  <p>Local-First Cloud Accounting &amp; Real-time ERP</p>
  <div class="spinner"></div>
  <div class="status-text" id="status">Loading offline workspace...</div>

  <script>
    // Bootstraps PWA / Local-First Navigation
    const statusEl = document.getElementById("status");

    async function bootstrap() {
      // Register service worker if available
      if ("serviceWorker" in navigator) {
        try {
          await navigator.serviceWorker.register("/sw.js");
        } catch (e) {
          console.warn("[PWA Bootstrap] SW registration:", e);
        }
      }

      // Route to dashboard or login
      const hasAuth = localStorage.getItem("vouch_access_token") || localStorage.getItem("access_token");
      const targetUrl = hasAuth ? "/dashboard" : "/login";
      statusEl.textContent = hasAuth ? "Opening dashboard..." : "Opening login...";
      window.location.replace(targetUrl);
    }

    window.addEventListener("DOMContentLoaded", () => {
      setTimeout(bootstrap, 350);
    });
  </script>
</body>
</html>

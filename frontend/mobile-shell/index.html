<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>SriLekh - Business Accounting & ERP</title>
  <meta name="theme-color" content="#0F172A" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #0F172A;
      color: #F8FAFC;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      text-align: center;
      padding: 24px;
    }
    .logo-container {
      margin-bottom: 20px;
      animation: pulse 2.5s infinite ease-in-out;
    }
    .logo-img {
      width: 104px;
      height: 104px;
      border-radius: 24px;
      box-shadow: 0 12px 30px -5px rgba(37, 99, 235, 0.45);
      object-fit: contain;
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.025em;
      margin-bottom: 6px;
    }
    .subtitle {
      color: #94A3B8;
      font-size: 13px;
      max-width: 320px;
      line-height: 1.5;
      margin-bottom: 28px;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top-color: #38BDF8;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    .status-text {
      font-size: 13px;
      color: #94A3B8;
      font-weight: 500;
      margin-bottom: 20px;
      max-width: 300px;
      line-height: 1.4;
    }
    .offline-card {
      display: none;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 20px;
      max-width: 340px;
      margin-top: 8px;
    }
    .offline-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: #FBBF24;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .offline-desc {
      font-size: 12px;
      color: #CBD5E1;
      line-height: 1.5;
      margin-bottom: 16px;
    }
    .retry-btn {
      background: linear-gradient(135deg, #2563EB, #1D4ED8);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px 24px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
      transition: all 0.2s ease;
    }
    .retry-btn:active {
      transform: scale(0.97);
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <img src="logo.png" alt="SriLekh Logo" class="logo-img" />
  </div>
  <h1>SriLekh</h1>
  <p class="subtitle">Local-First Cloud Accounting &amp; Real-time ERP</p>

  <div id="loading-state">
    <div class="spinner"></div>
    <div class="status-text" id="status">Connecting to workspace...</div>
  </div>

  <div class="offline-card" id="offline-state">
    <div class="offline-badge">Sign In Required</div>
    <p class="offline-desc">
      Please connect to the internet to sign in to your SriLekh account.
      <br /><br />
      <strong>Once you have signed in, you can operate the entire app offline in Airplane Mode.</strong>
    </p>
    <button class="retry-btn" onclick="retryNow()">Retry Connection</button>
  </div>

  <script>
    const baseUrl = "https://vouch-pi-one.vercel.app";
    const statusEl = document.getElementById("status");
    const loadingState = document.getElementById("loading-state");
    const offlineState = document.getElementById("offline-state");

    function showOfflineCard() {
      loadingState.style.display = "none";
      offlineState.style.display = "block";
    }

    function showLoading(msg) {
      loadingState.style.display = "block";
      offlineState.style.display = "none";
      if (msg) statusEl.textContent = msg;
    }

    function navigateToApp() {
      const hasAuth = localStorage.getItem("vouch_access_token") || localStorage.getItem("access_token");

      // If user has already signed in once, proceed directly to Dashboard!
      // Even in Airplane mode, Android WebView will load the cached dashboard and local IndexedDB data.
      if (hasAuth) {
        showLoading("Loading local workspace...");
        window.location.replace(baseUrl + "/dashboard");
        return;
      }

      // If user is not signed in yet:
      if (navigator.onLine) {
        showLoading("Opening login...");
        window.location.replace(baseUrl + "/login");
      } else {
        showOfflineCard();
      }
    }

    function retryNow() {
      if (navigator.onLine) {
        navigateToApp();
      } else {
        statusEl.textContent = "Connecting to internet...";
        loadingState.style.display = "block";
        offlineState.style.display = "none";
        setTimeout(navigateToApp, 1000);
      }
    }

    // Auto-reconnect the millisecond connection is restored
    window.addEventListener("online", () => {
      console.log("[Mobile Shell] Network restored, navigating...");
      navigateToApp();
    });

    window.addEventListener("DOMContentLoaded", () => {
      navigateToApp();
    });
  </script>
</body>
</html>
